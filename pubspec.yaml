name: expense_tracker
description: Personal lightweight, secure daily expense tracker for Android and iOS.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  cupertino_icons: ^1.0.8
  flutter_dotenv: ^5.2.1
  flutter_secure_storage: ^9.2.4
  http: ^1.3.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  local_auth: ^2.3.0
  path_provider: ^2.1.5
  quick_actions: ^1.1.0
  share_plus: ^10.1.4
  sqflite: ^2.4.1
  connectivity_plus: ^6.1.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "images/app_icon.png"
  adaptive_icon_background: "#0B46A8"
  adaptive_icon_foreground: "images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - images/logo.png
